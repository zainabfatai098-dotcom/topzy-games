<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topzy Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f13;--card:#1a1a24;--accent:#7c5cfc;--text:#f0f0f5;--dim:#a0a0b0;--border:#2a2a3a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none!important}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--card);padding:40px 32px;border-radius:24px;border:1px solid var(--border);width:100%;max-width:420px;text-align:center}
.box h1{font-size:2rem;margin-bottom:6px}
.box p{color:var(--dim);margin-bottom:20px;font-size:.95rem}
.box input{width:100%;padding:13px;margin-bottom:12px;border-radius:12px;border:1px solid var(--border);background:#252535;color:#fff;font-size:1rem}
.box button{width:100%;padding:13px;margin-top:6px;font-size:1rem}
.switch{margin-top:16px;color:var(--dim);font-size:.9rem}
.switch span{color:var(--accent);cursor:pointer;font-weight:600}
.contact{margin-top:20px;font-size:.85rem;color:var(--dim)}
.contact a{color:var(--accent)}
.app{max-width:1100px;margin:0 auto;padding:24px 16px}
.user-bar{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-bottom:16px;color:var(--dim)}
.user-bar button{background:transparent;border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:8px;cursor:pointer}
header{text-align:center;margin-bottom:28px}
header h1{font-size:2.5rem;background:linear-gradient(135deg,#7c5cfc,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 10px;text-align:center;cursor:pointer;transition:.2s}
.card:hover{border-color:var(--accent);transform:translateY(-4px)}
.card .icon{font-size:3rem;margin-bottom:8px}
.card .name{font-weight:600;font-size:.95rem}
#area{display:none}
#area.active{display:block}
.back{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:10px;cursor:pointer;margin-bottom:16px}
.gc{background:var(--card);border-radius:20px;padding:28px;border:1px solid var(--border);text-align:center}
button.btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600}
.controls{margin:14px 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.gb{display:grid;gap:5px;margin:14px auto}
.cell{background:#2a2a3a;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700}
.msg{margin-top:12px;font-weight:600;min-height:24px}
</style>
</head>
<body>
<div id="auth">
<div class="box">
<h1>🎮 Topzy Games</h1>
<p id="auth-title">Log in to play</p>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button id="auth-btn" onclick="handleAuth()">Log In</button>
<div class="switch"><span id="switch-text" onclick="toggleAuth()">Don't have an account? Sign Up</span></div>
<div class="contact">Need help? Email <a href="mailto:zainabfatai098@gmail.com">zainabfatai098@gmail.com</a></div>
</div>
</div>
<div id="main-app" class="hidden">
<div class="app">
<div class="user-bar"><span id="welcome"></span><button onclick="logout()">Log Out</button></div>
<header><h1>Topzy Games</h1></header>
<div id="game-select" class="grid"></div>
<div id="area">
<button class="back" onclick="back()">← Back</button>
<div id="game-content"></div>
</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
